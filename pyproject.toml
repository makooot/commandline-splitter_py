[project]
name = "commandline-splitter"
version = "0.1.0"
description = "Split the command line like bash."
readme = "README.md"
license = "MIT"
license-files = ["LICEN[CS]E*"]
authors = [
    { name = "HASHIGAYA, Makoto", email = "6903330+makooot@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "nox>=2026.8.17",
    "nox-uv>=0.8.0",
    "ruff>=0.16.5",
    "ty>=0.0.75",
]

[tool.ty.environment]
root = ["./src", "./test", "./test_package"]

[tool.ty.rules]
all = "error"
